<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 260" width="416" height="260" role="img" aria-label="The Tablox in-page toast: a yellow pill reading Tab archaeology begins, shown at the top of the page you are reading.">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="416" height="260" fill="#101216"/>
  <rect width="416" height="260" fill="url(#grid)"/>
  <path d="M396 20H20V240H396V20Z" fill="none" stroke="#FDCF06" stroke-opacity="0.5" stroke-dasharray="6 6"/>
  <path d="M20 60V20H60M356 20H396V60M20 200V240H60M356 240H396V200" stroke="#626871" stroke-width="1.2" fill="none"/>

  <!-- The page the toast lands on. -->
  <rect x="32" y="32" width="352" height="196" rx="8" fill="#14171B" stroke="#23272E"/>
  <g fill="#1E222A">
    <rect x="52" y="46" width="34" height="5" rx="2.5"/>
    <rect x="92" y="46" width="20" height="5" rx="2.5"/>
  </g>
  <rect x="52" y="58" width="312" height="1" fill="#1E222A"/>

  <!-- Toast pill: 999px radius, ~11px/20px padding, Crowded at 94%. -->
  <rect x="100" y="47" width="216" height="34" rx="17" fill="#000000" fill-opacity="0.28"/>
  <rect x="100" y="45" width="216" height="34" rx="17" fill="#FDCF06" fill-opacity="0.94"/>
  <text x="208" y="66.5" text-anchor="middle" font-family="'Martian Mono', ui-monospace, Menlo, monospace" font-size="10" letter-spacing="0.2" fill="#0B0D10">Tab archaeology begins</text>

  <!-- Page content underneath, deliberately quiet. -->
  <rect x="56" y="104" width="132" height="8" rx="4" fill="#333941"/>
  <g fill="#262B32">
    <rect x="56" y="126" width="150" height="5" rx="2.5"/>
    <rect x="56" y="138" width="188" height="5" rx="2.5"/>
    <rect x="56" y="150" width="120" height="5" rx="2.5"/>
    <rect x="56" y="162" width="164" height="5" rx="2.5"/>
    <rect x="56" y="174" width="92" height="5" rx="2.5"/>
  </g>
  <rect x="256" y="104" width="108" height="75" rx="6" fill="#1B1F25"/>
</svg>

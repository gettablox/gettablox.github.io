<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 260" width="416" height="260" role="img" aria-label="Tablox asks Chrome for one permission, tabs. No accounts, no analytics, no network requests.">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="416" height="260" fill="#101216"/>
  <rect width="416" height="260" fill="url(#grid)"/>
  <path d="M396 20H20V240H396V20Z" fill="none" stroke="#FF6F00" stroke-opacity="0.5" stroke-dasharray="6 6"/>
  <path d="M20 60V20H60M356 20H396V60M20 200V240H60M356 240H396V200" stroke="#626871" stroke-width="1.2" fill="none"/>

  <!-- The permission card Chrome would show. -->
  <rect x="100" y="34" width="216" height="192" rx="12" fill="#171A1F" stroke="#2A2F37"/>

  <g font-family="'Martian Mono', ui-monospace, Menlo, monospace">
    <!-- Extension identity. -->
    <rect x="116" y="52" width="18" height="18" rx="4" fill="#FF6F00"/>
    <g fill="#0B0D10">
      <rect x="120" y="57" width="3" height="8" rx="1.5"/>
      <rect x="125" y="54" width="3" height="11" rx="1.5"/>
      <rect x="130" y="59" width="3" height="6" rx="1.5"/>
    </g>
    <text x="142" y="61" font-size="10.5" fill="#E9EAEC">Tablox</text>
    <text x="142" y="73" font-size="8.5" fill="#626871">asks Chrome for</text>

    <line x1="116" y1="88" x2="300" y2="88" stroke="#23272E"/>

    <!-- The one permission it requests. -->
    <text x="116" y="108" font-size="7.5" letter-spacing="1.6" fill="#626871">REQUESTED</text>
    <path d="M117.5 126.5l2.5 2.5 5-5.5" stroke="#19DF96" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="130" font-size="10.5" fill="#E9EAEC">tabs</text>
    <text x="300" y="130" text-anchor="end" font-size="8.5" fill="#626871">count only</text>

    <line x1="116" y1="142" x2="300" y2="142" stroke="#23272E"/>

    <!-- Everything it deliberately does not ask for. -->
    <text x="116" y="160" font-size="7.5" letter-spacing="1.6" fill="#626871">NEVER REQUESTED</text>
    <g stroke="#4A505A" stroke-width="1.6" stroke-linecap="round">
      <path d="M117 178h6"/>
      <path d="M117 196h6"/>
      <path d="M117 214h6"/>
    </g>
    <g font-size="10" fill="#8B9099">
      <text x="134" y="182">accounts</text>
      <text x="134" y="200">analytics</text>
      <text x="134" y="218">network requests</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Placeholder for a screenshot of the Tablox icon and badge in a Chrome toolbar">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="dash" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0v12" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="#101216"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- corner ticks -->
  <g stroke="#626871" stroke-width="1.5" fill="none">
    <path d="M40 78V40h38M1122 40h38v38M40 672v38h38M1122 710h38v-38"/>
  </g>

  <!-- the frame -->
  <rect x="80" y="110" width="1040" height="530" fill="none" stroke="#19DF96" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="8 8"/>
  <rect x="80" y="110" width="1040" height="530" fill="url(#dash)" opacity="0.5"/>

  <!-- crosshair -->
  <g stroke="#19DF96" stroke-opacity="0.28" stroke-width="1">
    <path d="M600 110v530M80 375h1040"/>
  </g>
  <circle cx="600" cy="375" r="3" fill="#19DF96" fill-opacity="0.5"/>

  <g font-family="'Martian Mono', ui-monospace, Menlo, monospace" text-anchor="middle">
    <text x="600" y="345" fill="#19DF96" font-size="15" letter-spacing="4">PLACEHOLDER</text>
    <text x="600" y="398" fill="#e9eaec" font-size="27" letter-spacing="1.5">SCREENSHOT — TABLOX IN THE TOOLBAR</text>
    <text x="600" y="440" fill="#626871" font-size="14" letter-spacing="3">1200 × 750 · DROP IN toolbar.png</text>
  </g>

  <!-- suggested crop guides: the toolbar strip -->
  <g opacity="0.85">
    <rect x="80" y="110" width="1040" height="64" fill="#19DF96" fill-opacity="0.06"/>
    <path d="M80 174h1040" stroke="#19DF96" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 6"/>
    <text x="96" y="148" font-family="'Martian Mono', ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2.5" fill="#19DF96" fill-opacity="0.8">CROP TO THIS STRIP FOR THE HERO</text>
  </g>

  <g font-family="'Martian Mono', ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2.5" fill="#626871">
    <text x="40" y="30">TABLOX / ASSET 01</text>
    <text x="1160" y="30" text-anchor="end">16:10</text>
    <text x="40" y="730">images/placeholder-toolbar.svg</text>
    <text x="1160" y="730" text-anchor="end">REPLACE ME</text>
  </g>
</svg>
